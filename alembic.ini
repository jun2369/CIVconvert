# Only for developers creating new migrations:
#   .venv\Scripts\alembic revision --autogenerate -m "what changed"
# The database is DATABASE_URL (default: data/civconvert.db). The app migrates itself on start.
[alembic]
script_location = civconvert/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
