<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作面板 · CIVconvert</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/preview.css">
<style>
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button { font: inherit; font-size: 14px; padding: 7px 14px; border: 0; background: none; color: var(--text); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; cursor: pointer; }
  .stat:hover { border-color: var(--accent); }
  .stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .stat .n { display: block; font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat.warn .n { color: var(--warn); } .stat.err .n { color: var(--err); } .stat.ok .n { color: var(--ok); } .stat.info .n { color: var(--accent); }

  .upload { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; align-items: start; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px 16px; text-align: center; color: var(--muted); transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { color: var(--text); }
  ul.files { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  ul.files li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; overflow-wrap: anywhere; }
  .uploadbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 12px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  select#customer { width: 100%; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .filters input[type=search] { min-width: 240px; flex: 1 1 240px; }
  .filters .dates { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table.list { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.list th, table.list td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  table.list th { background: var(--field); color: var(--muted); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
  table.list tbody tr { cursor: pointer; }
  table.list tbody tr:hover td { background: var(--accent-soft); }
  table.list tbody tr:last-child td { border-bottom: 0; }
  td.name { white-space: normal !important; min-width: 220px; }
  td.name b { display: block; overflow-wrap: anywhere; }
  td.name .hint { display: block; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 6px; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
  .err-line { color: var(--err); font-size: 12px; white-space: normal; max-width: 360px; }
  @media (max-width: 760px) { .upload { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/">CIVconvert <small>Commercial Invoice → CargoWise</small></a><span class="grow"></span></header>
<main class="page">
  <div class="head">
    <div><h1>工作面板</h1><p class="sub" id="greeting"></p></div>
    <div class="seg" role="group" aria-label="范围">
      <button type="button" data-scope="mine" class="on">我的文档</button><button type="button" data-scope="all">全部文档</button>
    </div>
  </div>

  <section class="stats" id="stats" aria-label="统计"></section>

  <section class="panel">
    <h2>上传 Commercial Invoice</h2>
    <div class="upload">
      <label class="field">客户
        <select id="customer"><option value="">自动识别（根据 PDF 内容）</option></select>
      </label>
      <div>
        <div class="drop" id="drop">
          <strong>把 PDF 拖到这里</strong> 或 <button type="button" class="link" id="pick">选择文件</button>（可多选）
          <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
          <div class="hint">每份发票保存为一个文档，可以随时回来继续编辑</div>
        </div>
        <ul class="files" id="filelist"></ul>
        <div class="uploadbar">
          <label class="check" id="mergeRow" hidden><input type="checkbox" id="merge"> 这些 PDF 是<b>同一张发票</b>被拆开的（合并成一个文档）</label>
          <button type="button" class="btn primary" id="go" disabled>上传并转换</button>
          <span class="hint" id="upStatus"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="filters">
      <input type="search" id="q" placeholder="搜索发票号或文档名称" aria-label="搜索">
      <select id="status" aria-label="状态">
        <option value="">全部状态</option>
        <option value="processing">处理中</option>
        <option value="editing">编辑中</option>
        <option value="review">需复核</option>
        <option value="confirmed">已确认</option>
        <option value="failed">失败</option>
        <option value="attention">失败或需人工检查</option>
      </select>
      <span class="dates">创建日期 <input type="date" id="from" aria-label="从"> – <input type="date" id="to" aria-label="到"></span>
      <button type="button" class="btn small" id="reset">清除筛选</button>
    </div>
    <div id="listError"></div>
    <div class="tablewrap">
      <table class="list">
        <thead><tr><th>文档 / 发票号</th><th>状态</th><th class="num">行数</th><th>客户</th><th>创建人</th><th>创建时间</th><th>最后修改</th><th>CSV 导出</th><th>操作</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager"><span class="hint" id="count"></span><span><button type="button" class="btn small" id="prev">上一页</button> <button type="button" class="btn small" id="next">下一页</button></span></div>
  </section>
</main>
<script src="/static/app.js"></script>
<script src="/static/preview.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
