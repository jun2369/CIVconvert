<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · NIMBUS CIV CONVERTER</title>
<script src="/static/prefs.js"></script>
<link rel="stylesheet" href="/static/app.css">
<style>
  /* this page keeps its own colours (AGS navy and blue), apart from the violet of the other pages */
  :root { --glass: rgba(255, 255, 255, .93); --glass-line: rgba(255, 255, 255, .7); --title: #12306a;
          --text: #19202c; --muted: #5d6676; --line: #dce1e9; --line-strong: #dce1e9; --field: #f8f9fb; --panel: #ffffff;
          --accent: #1d58d6; --accent-text: #ffffff; --accent-soft: #e7eefe; }
  :root[data-theme="dark"] { --glass: rgba(19, 24, 35, .86); --glass-line: rgba(255, 255, 255, .1); --title: #eef3ff;
          --text: #e6e9ef; --muted: #9aa3b2; --line: #2b313c; --line-strong: #2b313c; --field: #12161c; --panel: #191d24;
          --accent: #78a0ff; --accent-text: #0c1322; --accent-soft: #1c2944; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --glass: rgba(19, 24, 35, .86); --glass-line: rgba(255, 255, 255, .1); --title: #eef3ff;
          --text: #e6e9ef; --muted: #9aa3b2; --line: #2b313c; --line-strong: #2b313c; --field: #12161c; --panel: #191d24;
          --accent: #78a0ff; --accent-text: #0c1322; --accent-soft: #1c2944; }
  }
  .card .btn { border-radius: 8px; font-weight: 600; }
  .card .btn.small { font-weight: 500; }
  .card input { border-radius: 8px; }
  .card input:hover { border-color: var(--line); }
  .card input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; box-shadow: none; border-color: var(--line); }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: #06142e; overflow-x: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .card { position: relative; z-index: 1; width: min(400px, 100%); box-sizing: border-box; padding: 16px 28px 26px; border-radius: 16px;
          background: var(--glass); border: 1px solid var(--glass-line); box-shadow: 0 24px 60px rgba(2, 10, 30, .5);
          -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); animation: card-in .5s ease-out both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .top { display: flex; justify-content: flex-end; min-height: 30px; }
  .brand { text-align: center; margin: 4px 0 22px; }
  .logo { display: inline-block; height: 64px; padding: 6px 12px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(2, 10, 30, .18); }
  .brand h1 { margin: 16px 0 0; font-size: 21px; font-weight: 800; letter-spacing: .06em; color: var(--title); }
  .accent { width: 44px; height: 3px; margin: 10px auto 0; border-radius: 2px; background: #d7262e; }
  form { display: grid; gap: 14px; }
  .pw { position: relative; }
  .pw input { width: 100%; padding-right: 64px; }
  .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
  input[type=email], input[type=password], input[type=text] { width: 100%; }
  .btn.primary.wide { width: 100%; padding: 10px; font-size: 15px; margin-top: 4px; }
  .dev { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .dev summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .dev form { margin-top: 10px; }
  #error .msg { margin-bottom: 14px; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="card">
  <div class="top"></div>
  <div class="brand">
    <img class="logo" src="/static/ags-logo.png" alt="AGS – Accelerated Global Solutions">
    <h1>NIMBUS CIV CONVERTER</h1>
    <div class="accent"></div>
  </div>
  <div id="error"></div>
  <form id="login" novalidate>
    <label class="field"><span data-i18n="login.email">Username</span>
      <input type="text" id="email" autocomplete="username" placeholder="you@agslogistics.com" required>
    </label>
    <label class="field"><span data-i18n="login.password">Password</span>
      <span class="pw"><input type="password" id="password" autocomplete="current-password" required>
        <button type="button" class="btn small ghost" id="show" data-i18n="login.show" data-i18n-aria="login.show_aria">Show</button></span>
    </label>
    <button type="submit" class="btn primary wide" id="go" data-i18n="login.submit">Sign in</button>
  </form>
  <details class="dev" id="devBox" hidden>
    <summary data-i18n="login.dev_summary">Development login</summary>
    <form id="devForm">
      <label class="field"><span data-i18n="login.dev_email">E-mail</span> <input type="email" id="devEmail" placeholder="test.op@agslogistics.com"></label>
      <label class="field"><span data-i18n="login.dev_name">Name (optional)</span> <input type="text" id="devName"></label>
      <button type="submit" class="btn" data-i18n="login.dev_submit">Development login</button>
    </form>
  </details>
</main>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
<script>
(() => {
  const { $, el, api } = CIV;
  const { t } = CIVi18n;
  CIVi18n.apply();
  document.title = t("login.page_title");
  $(".top").append(CIVi18n.controls());
  const next = (() => {
    const n = new URLSearchParams(location.search).get("next") || "/";
    return n.startsWith("/") && !n.startsWith("//") && !n.includes("\\") ? n : "/";
  })();
  const showError = (text) => $("#error").replaceChildren(text ? el("div", { class: "msg err", text }) : "");

  async function submit(path, body, button) {
    showError("");
    button.disabled = true;
    const label = button.textContent;
    button.replaceChildren(el("span", { class: "spin" }), " " + t("login.signing_in"));
    try {
      await api(path, { method: "POST", json: body, quiet401: true });
      location.replace(next);
    } catch (e) {
      showError(e.message);
      button.disabled = false;
      button.textContent = label;
    }
  }

  $("#login").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = $("#email").value.trim(), password = $("#password").value;
    if (!email || !password) { showError(t("err.email_password_required")); return; }
    try { localStorage.setItem("civconvert.email", email); } catch { /* private mode */ }
    submit("/api/auth/login", { email, password }, $("#go"));
  });
  $("#show").onclick = () => {
    const pw = $("#password");
    pw.type = pw.type === "password" ? "text" : "password";
    $("#show").textContent = t(pw.type === "password" ? "login.show" : "login.hide");
  };
  $("#devForm").addEventListener("submit", (e) => {
    e.preventDefault();
    submit("/api/auth/dev-login", { email: $("#devEmail").value.trim(), name: $("#devName").value.trim() || null }, e.submitter);
  });

  try { $("#email").value = localStorage.getItem("civconvert.email") || ""; } catch { /* private mode */ }
  ($("#email").value ? $("#password") : $("#email")).focus();
  api("/api/auth/config").then((cfg) => {
    $("#devBox").hidden = !cfg.dev_login;
    if (!cfg.nimbus) {
      $("#login").hidden = true;
      showError(t("login.nimbus_off"));
    }
  }).catch((e) => showError(e.message));
})();
</script>
<script src="/static/login-bg.js"></script>
</body>
</html>
