<!doctype html>
<html lang="en">
<head>

<body class="editor">
<header class="topbar"><a class="brand" href="/"><span class="nb">NIMBUS</span> CIV CONVERTER</a><span class="grow"></span></header>
<div class="docbar">
  <a class="back" href="/" data-i18n="ed.back">← Dashboard</a>
  <h1 id="title">…</h1>
  <span id="badges"></span>
  <span class="meta" id="meta"></span>
  <span class="grow"></span>
  <span class="savestate" id="savestate" role="status" aria-live="polite"></span>
</div>
<div class="toolbar" id="toolbar" hidden>
  <button type="button" class="btn small" id="undo" data-i18n-title="tb.undo_tip">↶ <span class="lbl" data-i18n="tb.undo">Undo</span></button>
  <button type="button" class="btn small" id="redo" data-i18n-title="tb.redo_tip">↷ <span class="lbl" data-i18n="tb.redo">Redo</span></button>
  <span class="sep"></span>
  <button type="button" class="btn small" id="insert" data-i18n-title="tb.insert">＋ <span class="lbl" data-i18n="tb.insert">Insert rows</span></button>
  <button type="button" class="btn small danger" id="delrows" data-i18n-title="tb.delete_tip">－ <span class="lbl" data-i18n="tb.delete">Delete rows</span></button>
  <button type="button" class="btn small" id="clear" data-i18n-title="tb.clear_tip">⌫ <span class="lbl" data-i18n="tb.clear">Clear</span></button>
  <span class="sep"></span>
  <span class="issues" id="issues"></span>
  <span class="sep"></span>
  <button type="button" class="btn small" id="preview" data-i18n-title="tb.preview_tip" data-i18n="tb.preview">Preview</button>
  <button type="button" class="btn small" id="pdf" data-i18n-title="tb.pdf_tip">PDF</button>
  <button type="button" class="btn small" id="history" data-i18n-title="tb.history_tip" data-i18n="tb.history">History</button>
  <span class="grow"></span>
  <button type="button" class="btn small" id="save" data-i18n-title="tb.save_tip">Save</button>
  <button type="button" class="btn small" id="xlsx" data-i18n-title="tb.excel_tip">Excel</button>
  <button type="button" class="btn small primary" id="csv" data-i18n-title="tb.csv_tip" data-i18n="tb.csv">Export CSV</button>
  <button type="button" class="btn small ok" id="confirm" data-i18n-title="tb.confirm_tip" data-i18n="tb.confirm">Confirm</button>
  <button type="button" class="btn small" id="reopen" hidden data-i18n-title="tb.reopen_tip" data-i18n="tb.reopen">Reopen</button>
</div>
<div id="banners"></div>
<div class="fbar" id="fbar" hidden>
  <span class="addr" id="addr"></span><span class="fx">fx</span>
  <input type="text" id="formula" data-i18n-aria="fx.aria" spellcheck="false" autocomplete="off">
</div>
<div class="gridwrap" id="gridwrap" hidden><div class="sh" id="grid"></div></div>
<div class="statusbar" id="statusbar" hidden></div>
<div class="center" id="center"><span><span class="spin"></span> <span data-i18n="ed.opening">Opening the document…</span></span></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
